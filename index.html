<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Musik Every Day</title>
    <link rel="stylesheet" href="src/output.css" />
  </head>
  <body class="bg-slate-800">
    <header>
      <h2 class="text-purple-600 text-4xl m-20 text-center font-bold uppercase">
        like musik🎧
      </h2>
    </header>
    <div>
      <input
        class="m-5 px-5 py-1 text-slate-200 focus:outline-1 focus:outline-white bg-slate-600 rounded-sm"
        type="text"
        id="searchInput"
        placeholder="cari Lagu"
      />
      <button
        class="text-white bg-slate-500 w-15 h-auto rounded-2xl hover:cursor-pointer"
        id="searchBtn"
      >
        Cari
      </button>
    </div>

    <!-- menampillkan lagu -->
    <section
      id="results"
      class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"
    ></section>

      <h3 class="">Judul Lagu</h3>
    </div> -->

  <script src="app.js"></script>
